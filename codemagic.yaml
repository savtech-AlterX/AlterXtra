workflows:
  ios-build:
    name: AlterX iOS Build
    

    integrations:

      app_store_connect: Codemagicc

    max_build_duration: 120
    
    instance_type: mac_mini_m2

    environment: 
      groups:
        - apple_upload
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alterxtra.app
      vars:
        XCODE_WORKSPACE: "AlterXtra.xcworkspace"
        XCODE_SCHEME: "AlterXtra"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/*.xcodeproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to App Store Connect
        script: |
          unset APP_STORE_CONNECT_ISSUER_ID
          unset APP_STORE_CONNECT_KEY_IDENTIFIER
          unset APP_STORE_CONNECT_PRIVATE_KEY
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --apple-id "$APPLE_ID_EMAIL" \
            --password @env:APP_SPECIFIC_PASSWORD

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
