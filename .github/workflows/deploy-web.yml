name: Build AlterX app web preview (no deployment)

# Keep the Expo web export available for CI checks, but do not publish it to
# GitHub Pages. The public URL is reserved for the separate marketing website.
on:
  push:
    branches: ['claude/hello-46bydk']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
