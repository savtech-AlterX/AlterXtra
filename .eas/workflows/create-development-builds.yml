name: Create development builds

# Manual only — this used to fire on every push to claude/hello-46bydk,
# which meant every small commit burned a build (often two: iOS + Android),
# and ran through a whole month's free EAS build credits in about two days.
# Trigger it by hand from the Workflows tab on the EAS dashboard, or with
# `eas workflow:run .eas/workflows/create-development-builds.yml`, only
# when a development build is actually needed.

jobs:
  build_ios:
    name: Build iOS (development)
    type: build
    params:
      platform: ios
      profile: development
  build_android:
    name: Build Android (development)
    type: build
    params:
      platform: android
      profile: development
